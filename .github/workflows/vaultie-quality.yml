name: Vaultie quality gates

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note-integrity:
    name: Lint knowledge notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML validator
        run: python -m pip install PyYAML==6.0.2
      - name: Test Vaultie tooling
        run: python -m unittest discover -s .agent/scripts/tests -v
      - name: Validate Antigravity skill registry
        run: python .agent/scripts/validate_skills.py
      - name: Lint Vaultie notes
        run: python .agent/scripts/vaultie-lint.py
